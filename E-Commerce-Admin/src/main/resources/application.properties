spring.application.name=E-Commerce-Admin
server.port=8081
server.servlet.session.cookie.name=ADMINSESSION
server.servlet.session.timeout=30m
spring.config.import=optional:file:./E-Commerce-Admin/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never

spring.application.name=E-Commerce
spring.config.import=optional:file:./E-Commerce/application-local.properties,optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:clave-desarrollo-local-ecommerce-appsweb-itson-minimo-32-bytes-hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

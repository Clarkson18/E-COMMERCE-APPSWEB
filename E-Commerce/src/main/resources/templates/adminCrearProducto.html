<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Crear producto</title>
    <link rel="stylesheet" th:href="@{/styles/styles.css}" href="../static/styles/styles.css">
</head>

<body>
    <header>
        <div class=div>
            <div class="logo">
                <a href="./index.html">
                    <h1>Logo de la marca</h1>
                </a>
            </div>
            <div class="usuario">
                <a href="./perfilUsuario.html"><img th:src="@{/imgs/user.png}" src="../static/imgs/user.png" alt=""></a>
                <h3>Cerrar sesión</h3>
            </div>
        </div>
    </header>
    <div class="contenido-flex">
        <aside>
            <a href="./catalogo.html">Catalogo</a>
            <a href="./carrito.html">Carrito</a>
            <a href="./pedidos.html">Gestion de pedidos</a>
            <a href="./adminPrincipal.html">Administrador</a>
            <a href="./login.html">Iniciar Sesión</a>
        </aside>
        <main class="main-index">
            <div class="top-contenedor">
                <a href="adminCatalogo.html"><img th:src="@{/imgs/back.png}" src="../static/imgs/back.png"></a>
                <h1>Crear nuevo producto</h1>
            </div>
            <div class="admin-form-container">
                <div class="admin-form-box">
                    <h3>Información del producto</h3>
                    <form class="form-login">
                        <div class="input-group"><label>Nombre</label><input type="text" class="input-stroke"></div>
                        <div class="input-group"><label>Precio</label><input type="number" class="input-stroke"></div>
                        <div class="input-group"><label>Stock</label><input type="number" class="input-stroke"></div>
                        <div class="input-group"><label>Descripción</label><textarea class="input-stroke"
                                rows="4"></textarea></div>
                        <div class="admin-form-buttons">
                            <a href="adminCatalogo.html" class="btn-add">Añadir Producto</a>
                            <a href="adminCatalogo.html" class="btn-cancel">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <footer>
        <div class="logo-footer">
            <img th:src="@{/imgs/svg/logoBlanco.svg}" src="../static/imgs/svg/logoBlanco.svg" alt="">
            <p>Aplicaciones Web - Unidad 2</p>
            <br>
        </div>

        <div class="contacto">
            <h3>Contáctanos</h3>
            <ul class="social-links">
                <li><a href="https://www.whatsapp.com/"><img th:src="@{/imgs/whatsappLogo.svg}" src="../static/imgs/whatsappLogo.svg" alt="WhatsApp"></a></li>
                <li><a href="https://www.instagram.com/"><img th:src="@{/imgs/instaLogo.svg}" src="../static/imgs/instaLogo.svg" alt="Instagram"></a>
                </li>
                <li><a href="https://www.facebook.com/"><img th:src="@{/imgs/facebookLogo.svg}" src="../static/imgs/facebookLogo.svg" alt="Facebook"></a></li>
                <li><a href="https://mail.google.com/"><img th:src="@{/imgs/gmailLogo.svg}" src="../static/imgs/gmailLogo.svg" alt="Correo"></a></li>
            </ul>

        </div>

        <div class="avisos">
            <ul class="legal-links">
                <li><a href="">Términos y condiciones</a></li>
                <li><a href="">Aviso de privacidad</a></li>
                <li><a href="">Políticas de cookies</a></li>
            </ul>
        </div>
    </footer>
</body>

</html>
